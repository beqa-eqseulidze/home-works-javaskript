<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ავტორიზაცია</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-700">
  <form id="loginForm" class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">ავტორიზაცია</h2>

    <label for="username" class="block text-sm font-semibold text-gray-600 mb-1">მომხმარებლის სახელი</label>
    <input
      type="text"
      id="username"
      placeholder="შეიყვანეთ username"
      required
      class="w-full px-4 py-3 mb-4 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none transition"
    />

    <label for="password" class="block text-sm font-semibold text-gray-600 mb-1">პაროლი</label>
    <input
      type="password"
      id="password"
      placeholder="შეიყვანეთ პაროლი"
      required
      class="w-full px-4 py-3 mb-4 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none transition"
    />

    <button
      type="submit"
      id="loginBtn"
      class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed transition"
    >
      შესვლა
    </button>

    <div id="message" class="mt-4 hidden px-4 py-3 rounded-lg text-center font-medium"></div>
  </form>

  <script src="main.js"></script>
</body>
</html>
