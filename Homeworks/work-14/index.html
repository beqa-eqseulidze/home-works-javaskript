<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800">
  <div class="w-[380px] p-8 rounded-3xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl">
    <h1 class="text-4xl font-bold text-center text-white mb-8">
      Login
    </h1>

    <!-- Username -->
    <div class="mb-5">
      <label class="block mb-2 text-white font-semibold">
        Username
      </label>
      <input
        type="text"
        id="username"
        placeholder="Enter username"
        class="w-full px-4 py-3 rounded-xl bg-white/20 text-white placeholder:text-white/60 outline-none border border-transparent focus:border-indigo-400 transition"
      >
    </div>

    <!-- Password -->
    <div class="mb-6">
      <label class="block mb-2 text-white font-semibold">
        Password
      </label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        class="w-full px-4 py-3 rounded-xl bg-white/20 text-white placeholder:text-white/60 outline-none border border-transparent focus:border-indigo-400 transition"
      >
    </div>

    <!-- Button -->
    <button
      id="loginBtn"
      class="w-full py-3 rounded-xl bg-indigo-500 hover:bg-indigo-600 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed transition text-white font-bold text-lg"
    >
      Login
    </button>

    <!-- Message notification -->
    <div
      id="notification"
      class="mt-5 text-center font-semibold text-white"
    ></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
