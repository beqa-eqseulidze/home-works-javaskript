<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩანაწერები</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-blue-700 min-h-screen">

    <header class="bg-[#1e4646] text-white px-6 py-4 flex justify-between items-center shadow">
        <h1 class="text-x1 font-bold">ჩანაწერები</h1>
        <div class="text-2xl"></div>
    </header>

    <div class="flex flex-col md:flex-row min-h-[calc(100vh-60px)]">
        
        <aside class="w-full md:w-1/5 bg-[#fbbf24] p-4 border-r border-gray-200">
            <ul class="space-y-2" id="sidebar-menu">
                <li data-category="all" class="category-btn p-3 rounded cursor-pointer bg-[#cbd5e1] font-bold text-gray-700">
                     ყველა
                </li>
                <li data-category="work" class="category-btn p-3 rounded cursor-pointer hover:bg-[#f59e0b] text-gray-1000 transition">
                     სამუშაო
                </li>
                <li data-category="personal" class="category-btn p-3 rounded cursor-pointer hover:bg-[#f59e0b] text-gray-1000 transition">
                   პირადი
                </li>
                <li data-category="ideas" class="category-btn p-3 rounded cursor-pointer hover:bg-[#f59e0b] text-gray-1000 transition">
                    იდეები
                </li>
                <li data-category="study" class="category-btn p-3 rounded cursor-pointer hover:bg-[#f59e0b] text-gray-1000 transition">
                   სწავლა
                </li>
            </ul>
        </aside>

        <main class="w-full md:w-4/5 p-6 space-y-6">
            
            <section class="bg-[#fbcbbb] p-4 rounded-lg shadow">
                <h2 class="font-bold text-gray-800 mb-3">ახალი ჩანაწერი</h2>
                
               <input type="text" id="note-title" placeholder="ჩანაწერის სათაური..." class="w-full p-2 mb-2 rounded border border-gray-300 outline-none transition-all duration-300 shadow-sm text-gray-500 blur-[0.4px] focus:blur-none focus:-translate-y-1 focus:border-gray-600 focus:text-gray-950 focus:font-semibold focus:shadow-md">
                <textarea id="note-text" placeholder="დაწერეთ თქვენი ჩანაწერი აქ..." rows="3" class="w-full p-2 mb-3 rounded border border-gray-300 outline-none transition-all duration-300 shadow-sm text-gray-500 blur-[0.4px] focus:blur-none focus:-translate-y-1 focus:border-gray-600 focus:text-gray-950 focus:font-semibold focus:shadow-md"></textarea>
                
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                    <div>
                        <span class="text-sm text-gray-700 mr-2">აირჩიეთ კატეგორია:</span>
                        <select id="note-category" class="p-2 bg-white rounded border border-gray-300">
                            <option value="work">სამუშაო</option>
                            <option value="personal">პირადი</option>
                            <option value="ideas">იდეები</option>
                            <option value="study">სწავლა</option>
                        </select>
                    </div>
                    
                    <button id="add-note-btn" class="bg-[#84cc16] text-white px-20 py-2 rounded font-bold hover:bg-opacity-50">
                        დამატება
                    </button>
                </div>
            </section>

            <section id="notes-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                </section>
            
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
