<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>products-app</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100 relative">
      
      <div id="successMessage" class="hidden mb-4 p-3 rounded-lg text-center font-medium"></div>
      
      <button id="logoutBtn" class="hidden w-full bg-red-500 hover:bg-red-600 text-white font-medium py-2.5 rounded-lg transition mb-4">
        გამოსვლა
      </button>

      <div id="welcomeBox" class="space-y-4 text-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">მოგესალმებით</h2>
        <button id="welcomeSignUp" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition shadow-md">
          რეგისტრაცია (Sign Up)
        </button>
        <button id="welcomeSignIn" class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-3 rounded-lg transition shadow-sm">
          სისტემაში შესვლა (Sign In)
        </button>
      </div>

      <div id="formWrapper" class="hidden">
        
        <button id="backBtn" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium flex items-center mb-4 transition">
          ← უკან დაბრუნება
        </button>

        <div class="flex border-b border-gray-200 mb-6">
          <button id="up" class="w-1/2 pb-3 text-center font-medium text-gray-500 border-b-2 border-transparent hover:text-indigo-600 transition-all focus:outline-none">
            Sign Up
          </button>
          <button id="in" class="w-1/2 pb-3 text-center font-medium text-gray-500 border-b-2 border-transparent hover:text-indigo-600 transition-all focus:outline-none">
            Sign In
          </button>
        </div>

        <div id="signUpFormContainer" class="hidden">
          <h3 class="text-xl font-bold text-gray-800 mb-4 text-center">ანგარიშის შექმნა</h3>
          <form id="signUpForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1">ელ. ფოსტა</label>
              <input type="email" id="upEmail" placeholder="example@gmail.com" required
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1">პაროლი</label>
              <input type="password" id="upPassword" placeholder="••••••••" required
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
              რეგისტრაცია
            </button>
          </form>
        </div>

        <div id="signInFormContainer" class="hidden">
          <h3 class="text-xl font-bold text-gray-800 mb-4 text-center">სისტემაში შესვლა</h3>
          <form id="signInForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1">ელ. ფოსტა</label>
              <input type="email" id="inEmail" placeholder="example@gmail.com" required
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1">პაროლი</label>
              <input type="password" id="inPassword" placeholder="••••••••" required
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
              შესვლა
            </button>
          </form>
        </div>

      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
