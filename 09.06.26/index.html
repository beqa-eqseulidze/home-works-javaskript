<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Store API App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#0f172a",
              mist: "#e2e8f0",
              accent: "#14b8a6",
              accent2: "#f97316",
            },
            boxShadow: {
              glow: "0 20px 60px rgba(20, 184, 166, 0.15)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top,_rgba(20,184,166,0.18),_transparent_35%),radial-gradient(circle_at_bottom_right,_rgba(249,115,22,0.15),_transparent_30%)]"></div>

    <main class="mx-auto flex min-h-screen w-full max-w-7xl flex-col px-4 py-6 sm:px-6 lg:px-8">
      <header class="mb-6 rounded-3xl border border-white/10 bg-white/5 p-5 shadow-glow backdrop-blur">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-sm uppercase tracking-[0.35em] text-teal-300/80">Fake Store API</p>
            <h1 class="mt-2 text-3xl font-bold text-white sm:text-4xl">Products, Users, Carts</h1>
            <p class="mt-2 max-w-2xl text-sm text-slate-300">
              Every tab triggers a fresh HTTP request and renders the data returned by
              <span class="font-medium text-white">fakestoreapi.com</span>.
            </p>
          </div>

          <nav class="flex flex-wrap gap-2">
            <button data-route="products" class="nav-btn rounded-full border border-white/10 bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/15">
              Products
            </button>
            <button data-route="users" class="nav-btn rounded-full border border-white/10 bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/15">
              Users
            </button>
            <button data-route="carts" class="nav-btn rounded-full border border-white/10 bg-white/10 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/15">
              Cart
            </button>
          </nav>
        </div>
      </header>

      <section
        id="status-panel"
        class="mb-4 hidden items-center justify-between gap-4 rounded-2xl border border-white/10 bg-slate-900/70 px-4 py-3 text-sm text-slate-300"
      >
        <div>
          Current page:
          <span id="current-page" class="font-semibold text-white">products</span>
        </div>
        <div id="status" class="text-slate-400">Loading data...</div>
      </section>

      <section
        id="content"
        class="hidden grid flex-1 gap-4 sm:grid-cols-2 xl:grid-cols-3"
        aria-live="polite"
        aria-busy="false"
      ></section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
