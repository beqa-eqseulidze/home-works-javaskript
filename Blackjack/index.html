<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blackjack</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-900 text-white overflow-hidden">

    <div class="h-screen flex flex-col">
        
<!-----------------------------------------------------------comp table-------------------------------------------------------------------------------------------------------->        
        <div id="comp-side" class="flex-1 bg-green-900 border-b-4 border-yellow-400 flex flex-col items-center justify-center p-4">
            <h2 class="text-2xl font-bold mb-4 text-white">Comp Score: <span id="comp-score">0</span></h2>
            <div id="comp-cards" class="flex gap-3 h-40">
                <!--cardis adgili-->
            </div>
        </div>

<!-----------------------------------------------------------center message------------------------------------------------------------------------------------------------------->

        <div id="game-message" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 text-5xl font-black text-white uppercase bg-sky-500/100 font-semibold">
          BLACKJACK
        </div>

<!------------------------------------------------------------player table------------------------------------------------------------------------------------------------------->
      
        <div id="player-side" class="flex-1 bg-green-800 flex flex-col items-center justify-center p-4 relative">
            <div id="player-cards" class="flex gap-3 h-40 mb-4">
            </div>
            <h2 class="text-2xl font-bold text-white">Your Score: <span id="player-score">0</span></h2>
        </div>

    </div>

<!------------------------------------------------------------my buttons------------------------------------------------------------------------------------------------------->
    
    <div class="fixed bottom-18 left-1/2 -translate-x-1/2 flex gap-5 z-30">
        <button id="btn-start" class="bg-white text-black px-8 py-3 rounded font-bold hover:bg-gray-200 uppercase">start Game</button>
        <button id="btn-add" class="hidden bg-blue-500 px-8 py-3 rounded font-bold hover:bg-blue-800 uppercase">add Card</button>
        <button id="btn-open" class="hidden bg-red-500 px-8 py-3 rounded font-bold hover:bg-red-800 uppercase">open Cards</button>
    </div>


    <script src="main.js"></script>
</body>
</html>
