<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link class="flex" rel="icon" href="./public/Schutzstaffel_Abzeichen.svg.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>product-app</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-900 font-sans flex flex-col items-center justify-center min-h-screen p-4">

  <div class="absolute top-0 left-0 right-0 flex justify-end space-x-4 p-4">
    <button id="signin"
      class="px-6 py-2.5 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 transition duration-200 cursor-pointer">Sign
      in</button>
    <button id="signup"
      class="px-6 py-2.5 bg-green-600 text-white font-medium rounded-lg shadow-md hover:bg-green-700 transition duration-200 cursor-pointer">Sign
      up</button>
    <button id="logout"
      class="px-6 py-2.5 bg-red-600 text-white font-medium rounded-lg shadow-md hover:bg-red-700 transition duration-200 cursor-pointer">Log
      out</button>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
