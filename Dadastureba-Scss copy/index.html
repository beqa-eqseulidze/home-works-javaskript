<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spending Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Balance Header -->
    <div class="balance-header">
      <div class="balance-content">
        <div class="balance-label">My balance</div>
        <div class="balance-amount">$921.48</div>
      </div>
      <div class="toggle-icon">◐</div>
    </div>

    <!-- Chart Section -->
    <div class="chart-section">
      <div class="chart-title">Spending - Last 7 days</div>
      
      <!-- Bars -->
      <div class="chart-bars">
        <div class="bar-item">
          <div class="bar" style="height: 45%;"></div>
          <div class="day-label">mon</div>
        </div>
        <div class="bar-item">
          <div class="bar" style="height: 62%;"></div>
          <div class="day-label">tue</div>
        </div>
        <div class="bar-item">
          <div class="bar accent" style="height: 80%;"></div>
          <div class="day-label">wed</div>
        </div>
        <div class="bar-item">
          <div class="bar" style="height: 40%;"></div>
          <div class="day-label">thu</div>
        </div>
        <div class="bar-item">
          <div class="bar" style="height: 50%;"></div>
          <div class="day-label">fri</div>
        </div>
        <div class="bar-item">
          <div class="bar" style="height: 75%;"></div>
          <div class="day-label">sat</div>
        </div>
        <div class="bar-item">
          <div class="bar" style="height: 55%;"></div>
          <div class="day-label">sun</div>
        </div>
      </div>

      <!-- Total Section -->
      <div class="total-section">
        <div class="total-left">
          <div class="total-label">Total this month</div>
          <div class="total-amount">$478.33</div>
        </div>
        <div class="total-right">
          <div class="percentage">+2.4%</div>
          <div class="meta">from last month</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
