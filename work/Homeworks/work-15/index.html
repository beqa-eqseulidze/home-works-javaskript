<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen text-gray-800">
    <div class="max-w-[90%] my-7 mx-auto grid grid-cols-1 md:grid-cols-[220px_1fr] gap-5">
        <aside
            class="sidebar flex flex-row flex-wrap justify-center md:flex-col md:justify-start gap-3.5 sticky top-5 h-max order-[-1] md:order-none">
            <button id="productsBtn"
                class="p-3.5 border-none rounded-lg bg-blue-600 text-white cursor-pointer text-base hover:opacity-80 transition-opacity">Products</button>
            <button id="usersBtn"
                class="p-3.5 border-none rounded-lg bg-blue-600 text-white cursor-pointer text-base hover:opacity-80 transition-opacity">Users</button>
            <button id="cartsBtn"
                class="p-3.5 border-none rounded-lg bg-blue-600 text-white cursor-pointer text-base hover:opacity-80 transition-opacity">Carts</button>
        </aside>

        <main id="container" class="grid grid-cols-[repeat(auto-fill,minmax(250px,1fr))] gap-5"></main>
    </div>
    <script src="main.js"></script>
</body>

</html>
