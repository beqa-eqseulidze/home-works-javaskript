<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLACKJACK</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-950 text-white min-h-screen py-8">
    <div class="max-w-4xl mx-auto px-4">
        <div class="bg-gradient-to-b from-zinc-900 to-black rounded-3xl shadow-2xl p-8 border border-yellow-500/30">

            <h1 class="text-5xl font-bold text-center mb-12 text-yellow-400 tracking-widest">
                ♠️ BLACKJACK ♠️
            </h1>
            <!-- კომპიუტერის div ი -->
            <div class="mb-10">
                <h2 class="text-2xl mb-4 text-red-400 font-bold text-center">მოწინააღმდეგე</h2>
                <div id="computerCards" class="flex gap-4 justify-center min-h-[200px]"></div>

                <p class="text-center mt-6 text-xl">
                    მოწინააღმდეგის ქულა:
                    <span id="computerScore" class="font-bold text-3xl text-red-400">?</span>
                </p>
            </div>

            <hr class="border-yellow-500/20 my-10">
            <!-- მოთამაშის div ი -->
            <div class="mb-10">
                <h2 class="text-2xl mb-4 text-emerald-400 font-bold text-center">შენ</h2>
                <div id="playerCards" class="flex gap-4 justify-center min-h-[200px]"></div>

                <p class="text-center mt-6 text-xl">
                    შენი ქულა:
                    <span id="playerScore" class="font-bold text-3xl text-emerald-400">0</span>
                </p>
            </div>
            <!-- ღილაკების div ი -->
            <div class="flex flex-wrap justify-center gap-6 mt-10">
                <button id="startBtn"
                    class="px-10 py-5 bg-yellow-500 hover:bg-yellow-400 text-black font-bold text-xl rounded-2xl transition-all active:scale-95 shadow-xl">
                    თამაშის დაწყება
                </button>

                <button id="hitBtn" disabled
                    class="px-10 py-5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xl rounded-2xl transition-all active:scale-95 shadow-xl disabled:opacity-50">
                    კარტის დამატება
                </button>

                <button id="standBtn" disabled
                    class="px-10 py-5 bg-red-600 hover:bg-red-500 font-bold text-xl rounded-2xl transition-all active:scale-95 shadow-xl disabled:opacity-50">
                    კარტების გახსნა
                </button>
            </div>

            <h2 id="result" class="text-center text-4xl font-bold mt-12 min-h-[70px]"></h2>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
