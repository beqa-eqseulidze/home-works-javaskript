<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="./style.css">

<body>
    <header id="header">
        <div class="header-content">
            <div class="logo-search-container">
                <img src="./images/logo.svg" alt="Extensions" id="logo" class="logo">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="Search extensions..." class="searchInput">
                </div>
            </div>
            <button class="background" id="theme-btn">
                <img id="theme-icon" src="./images/icon-sun.svg" alt="Switch to Light Mode">
            </button>
        </div>
    </header>
    <section>
        <h2>Extensions List</h2>
        <div class="buttons">
            <button>All</button>
            <button>Active</button>
            <button>Inactive</button>
        </div>
    </section>
    <main class="cards"></main>
    <script src="./main.js"></script>
</body>

</html>
