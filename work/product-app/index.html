<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link class="flex" rel="icon" href="./public/Schutzstaffel_Abzeichen.svg.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>product-app</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-900 font-sans flex flex-col items-center justify-center min-h-screen p-4">
  <!-- ნავიგაციის ღილაკები -->
  <div class="space-x-4 mb-8">
    <button id="signin"
      class="px-6 py-2.5 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 transition duration-200 cursor-pointer">Sign
      in</button>
    <button id="signup"
      class="px-6 py-2.5 bg-green-600 text-white font-medium rounded-lg shadow-md hover:bg-green-700 transition duration-200 cursor-pointer">Sign
      up</button>
  </div>

  <!-- === ავტორიზაციის კონტეინერი === -->
  <div id="auth-login"
    class="fixed inset-0 bg-gray-950/50 flex items-center justify-center hidden backdrop-blur-sm z-50">
    <div id="login-content"
      class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md transform transition-all scale-95 opacity-0 duration-300">
      <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Sign In</h2>

      <!-- ავტორიზაციისთვის გავლისას error ბლოკი -->
      <div id="login-error"
        class="hidden p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-lg border border-red-200 text-center font-medium">
      </div>

      <!-- ავტორიზაციის გავლის ბლოკი -->
      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">Email</label>
          <input type="email" id="login-email" required
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">Password</label>
          <input type="password" id="login-password" required
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150">
        </div>

        <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100">
          <button type="button" id="login-cancel"
            class="px-5 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition duration-150 cursor-pointer">Cancel</button>
          <button type="submit" id="login-submit"
            class="px-5 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm transition duration-150 cursor-pointer">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- === რეგისტრაციის კონტეინერი === -->
  <div id="auth-register"
    class="fixed inset-0 bg-gray-950/50 flex items-center justify-center hidden backdrop-blur-sm z-50">
    <div id="register-content"
      class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md transform transition-all scale-95 opacity-0 duration-300">
      <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Sign Up</h2>

      <!-- რეგისტრაციის გავლისას error ბლოკი -->
      <div id="register-error"
        class="hidden p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-lg border border-red-200 text-center font-medium">
      </div>

      <!-- რეგისტრაციის გავლის ბლოკი -->
      <form id="register-form" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">Email</label>
          <input type="email" id="register-email" required
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition duration-150">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">Password</label>
          <input type="password" id="register-password" required
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition duration-150">
        </div>

        <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100">
          <button type="button" id="register-cancel"
            class="px-5 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition duration-150 cursor-pointer">Cancel</button>
          <button type="submit" id="register-submit"
            class="px-5 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 shadow-sm transition duration-150 cursor-pointer">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
